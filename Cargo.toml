[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
hai-macros = { path = "crates/hai-macros" }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
config = { version = "0.15", default-features = false, features = ["toml", "convert-case"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

rmcp = { version = "3.2", default-features = false, features = ["client", "transport-child-process"] }
schemars = { version = "1", features = ["derive", "uuid1"] }
genai = "0.6"
agent-skills = "0.3"
teloxide = { version = "0.17", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
base64 = "0.23"
reqwest = { version = "0.13", features = ["json", "query", "form"] }
encoding_rs = "0.8"
url = "2"
mime = "0.3"
dom_smoothie = "0.18"
roxmltree = "0.21"
dom_query = "0.28"
derive_more = { version = "2", features = ["full"] }
jiff = { version = "0.2", features = ["serde"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid", "macros", "json"] }
jiff-sqlx = { version = "0.2", features = ["postgres"] }

uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
strum = { version = "0.28", features = ["derive"] }
toml = "1"
clap = { version = "4.5", features = ["derive", "color"] }
thiserror = "2"
rand = { version = "0.10" }
indexmap = { version = "2", features = ["serde"] }
futures = "0.3"
dirs = "7"
hound = "3.5"
linkify = "0.11"
sha2 = "0.11"
timeago = "0.6"
sanitize-filename = "0.6"
indicatif = "0.18"
ratatui = { version = "0.30", features = ["macros"] }
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
which = "8"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
strip = true
